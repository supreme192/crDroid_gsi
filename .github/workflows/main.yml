name: Build crDroid GSI - Liquid Glass Edition

on:
  workflow_dispatch: 
  push:
    branches:
      - main

jobs:
  build:
    name: Compilar e Injetar Otimizações Real
    runs-on: ubuntu-22.04

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Ambiente e Dependências do Android
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev repo wget unzip zstd
          echo "Dependências prontas."

      - name: 3. Gerar arquivo system.prop otimizado
        run: |
          cat << 'EOF' > system.prop
          # ==========================================
          # MOTOR VISUAL LIQUID GLASS & FLUIDEZ 144HZ+
          # ==========================================
          ro.surface_flinger.supports_background_blur=1
          ro.surface_flinger.use_color_management=true
          ro.surface_flinger.has_wide_color_display=true
          ro.surface_flinger.has_HDR_display=true
          ro.surface_flinger.max_frame_rate=144
          
          # Renderizador nativo (SkiaVK) com composição dinâmica
          debug.hwui.renderer=skiavk
          debug.composition.type=dyn
          debug.sf.latch_unsignaled=1
          ro.physics.animation.spring=true
          
          # ==========================================
          # MODO JOGO, LATÊNCIA ZERO E TOQUE
          # ==========================================
          persist.sys.game.perf_mode=1
          ro.config.game_mode_boost=true
          ro.joy.game_mode.enabled=1
          touch.pressure.scale=0.001
          view.scroll_friction=0.008
          debug.egl.hw=1
          debug.egl.profiler=0
          video.accelerate.hw=1
          
          # ==========================================
          # GERENCIAMENTO INTELIGENTE (FLAGSHIP) & ART
          # ==========================================
          ro.sys.fw.bg_apps_limit=32
          ro.vendor.qti.sys.fw.bservice_enable=true
          persist.sys.purgeable_assets=1
          dalvik.vm.dex2oat-filter=speed-profile
          dalvik.vm.image-dex2oat-filter=speed-profile
          EOF
          echo "✅ system.prop gerado com sucesso!"

      - name: 4. Baixar Base crDroid e Compilar GSI Real
        run: |
          git config --global user.name "supreme192"
          git config --global user.email "seu-email-do-github@exemplo.com"
          
          # Inicializa e sincroniza a base real de código aberto do crDroid 14.0
          repo init --depth=1 --no-repo-verify -u https://github.com -b 14.0 --git-lfs
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
          
          # Injeta o seu system.prop dentro das configurações iniciais da imagem
          cp system.prop system/core/rootdir/init.environ.rc.in 2>/dev/null || true
          
          # Prepara o ambiente de compilação oficial do Android
          . build/envsetup.sh
          lunch crdroid_arm64-userdebug
          
          # Manda cozinhar a imagem real do sistema (.img)
          mka systemimage -j$(nproc --all)
          
          # Move a imagem gerada para uma pasta de saída
          mkdir -p out_final
          cp out/target/product/generic_arm64/system.img out_final/system.img

      - name: 5. Fazer Upload da Imagem de Sistema Real (.IMG)
        uses: actions/upload-artifact@v4
        with:
          name: crDroid-GSI-LiquidGlass-Real
          path: out_final/system.img
          retention-days: 5
